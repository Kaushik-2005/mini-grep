[package]
name = "mini-grep"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Search files, directories, and standard input with a standalone Rust CLI."
readme = "README.md"
license = "MIT OR Apache-2.0"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "about.toml",
    "scripts/licenses.hbs",
    "scripts/package-release.ps1",
    "src/**",
    "tests/**",
    "benches/**",
    "proptest-regressions/**",
    "README.md",
    "docs/cli-contract.md",
    "CHANGELOG.md",
]

[dependencies]
anstream = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossbeam-channel = "0.5"
ctrlc = "3"
ignore = "0.4"
regex = "1"
regex-syntax = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "literal"
harness = false

[[bench]]
name = "repository"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[[bench]]
name = "reader"
harness = false

[[bench]]
name = "source_tree"
harness = false
